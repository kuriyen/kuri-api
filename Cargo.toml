[package]
name = "kuri-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["bayanasar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kuriyen/kuri-api"
description = "The contracts of a home's system plane as plain Rust types: grants and the checks a peer runs offline, signed requests, the home's clock, revocations, the registry and power. Bound to no transport."
keywords = ["home", "grants", "registry", "ed25519", "cbor"]
categories = ["authentication", "encoding"]

[dependencies]
ciborium = "0.2"
# Pure Rust, so every target builds with stable cargo and no C toolchain.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
