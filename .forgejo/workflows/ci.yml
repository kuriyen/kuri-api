name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: linux-docker
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml is the only pin; this is a no-op when the
          # toolchain it names is already installed.
          rustup toolchain install
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-fuchsia aarch64-unknown-fuchsia
          rustup show active-toolchain
          rustc --version

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --offline --locked -- -D warnings

      - name: Tests
        run: cargo test --offline --locked

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --offline --locked --no-deps

      # The targets a consumer builds for with stable cargo alone, Fuchsia
      # included. A library needs no linker for these, so checking is enough.
      - name: Other targets
        run: |
          for target in aarch64-unknown-linux-musl x86_64-unknown-fuchsia aarch64-unknown-fuchsia; do
            cargo check --offline --locked --target "$target"
          done

  # The oldest Rust that Cargo.toml's rust-version claims. Resolved afresh, as
  # a downstream edition 2021 workspace resolves: Cargo then picks the newest
  # compatible release of each dependency whatever Rust it needs, so a
  # dependency that raises its own minimum shows up here.
  msrv:
    name: msrv
    runs-on: linux-docker
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain from rust-version
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Build the library
        run: |
          cargo +"$MSRV" update
          cargo +"$MSRV" build --lib
